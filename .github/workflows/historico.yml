name: Historico UT (aislado + final)

on:
  workflow_dispatch:
  push:
    branches: [historico-ut]
    paths: ['historico/request.json']

permissions:
  contents: write

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historico-ut
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Descargar y extraer
        run: |
          python historico_debug.py
          echo skip
      - name: Guardar CSV en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico/data historico/debug
          git commit -m "data: historico UT $(date -u +%F)" || echo "sin cambios"
          git push origin HEAD:historico-ut
